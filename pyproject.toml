[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxpack"
version = "0.2.0"
description = "Fast, offline CLI to pack codebase context for LLMs with token budgeting"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Hakan Berkiten" }
]
dependencies = [
    "click>=8.1.0",
    "tiktoken>=0.7.0",
    "pathspec>=0.12.0",
    "pyperclip>=1.8.2",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
ctxpack = "ctxpack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ctxpack"]